name: Build, test and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate targets and release tag
        id: plan
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python3 scripts/prepare_release.py --tag "$RELEASE_TAG"
          else
            python3 scripts/prepare_release.py
          fi
  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - name: Select release owner
        id: release
        env:
          MINECRAFT_TARGET: ${{ matrix.minecraft }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = os.environ['MINECRAFT_TARGET']
          groups = json.loads(Path('gradle/release-groups.json').read_text())
          members = next((group for group in groups if target in group), [target])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"stage={str(target == members[0]).lower()}\n")
          PY
      - name: Build and run gameplay tests
        run: bash ./gradlew --no-daemon "-Preterra.targets=${{ matrix.minecraft }}" ":${{ matrix.minecraft }}:build" ":${{ matrix.minecraft }}:runGametest"
      - name: Verify and stage release
        if: steps.release.outputs.stage == 'true'
        run: bash ./gradlew --no-daemon "-Preterra.targets=${{ matrix.minecraft }}" ":${{ matrix.minecraft }}:stageRelease"
      - name: Check release assets
        if: steps.release.outputs.stage == 'true'
        run: |
          for jar in build/libs/*.jar; do
            python3 scripts/validate_release.py "$jar"
          done
      - name: Upload builds
        if: steps.release.outputs.stage == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reterra-mc${{ matrix.minecraft }}
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-mc${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/reports/
          if-no-files-found: ignore

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Collect verified release JARs
        uses: actions/download-artifact@v8
        with:
          pattern: reterra-mc*
          path: dist
          merge-multiple: true
      - name: Verify release files and prepare notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG" --assets dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$existing" == "false" ]]; then
              echo "Release $RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "ReTerra ${RELEASE_TAG#v}" --prerelease="$PRERELEASE" \
              --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" dist/*.jar dist/SHA256SUMS.txt \
            dist/release-manifest.json --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" \
            --title "ReTerra ${RELEASE_TAG#v}" --notes-file dist/release-notes.md
